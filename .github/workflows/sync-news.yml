name: Sync news from Google Sheet

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sheet and build news.json
        env:
          SHEET_CSV: https://docs.google.com/spreadsheets/d/e/2PACX-1vTZjgvJ4RYAGalux2HIusvfJH-SQ031s-G7QiKUppBIiA_XDyHPeOrf-XWKI0EI9oV4Wv9rky55Y1yY/pub?output=csv
        run: |
          python3 - <<'PY'
          import csv, io, json, os, re, urllib.request
          raw = urllib.request.urlopen(os.environ["SHEET_CSV"], timeout=30).read().decode("utf-8")
          rows = list(csv.DictReader(io.StringIO(raw)))
          out, seen = [], set()
          for r in rows:
              g = lambda k: (r.get(k) or "").strip()
              item = {
                  "date": g("date")[:10],
                  "title": g("title"),
                  "what": g("what"),
                  "free": g("free"),
                  "why": g("why"),
                  "steps": [s.strip() for s in g("steps").split("|") if s.strip()],
                  "link": g("link"),
                  "linkText": g("linkText") or "Official source",
                  "tags": [t.strip().lower() for t in re.split(r"[,;]", g("tags")) if t.strip()],
                  "source": g("source"),
              }
              if g("status").lower() != "verified": continue
              if not item["title"] or not re.match(r"^\d{4}-\d{2}-\d{2}$", item["date"]): continue
              if not re.match(r"^https?://", item["link"]): continue
              key = item["link"].lower()
              if key in seen: continue
              seen.add(key); out.append(item)
          out.sort(key=lambda x: x["date"], reverse=True)
          if not rows:
              raise SystemExit("Sheet returned no rows - keeping the old news.json")
          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f"{len(out)} verified items written")
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "softmax-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "News update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No new news"
          fi
