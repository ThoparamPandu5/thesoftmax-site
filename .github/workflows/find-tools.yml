name: Find new AI tools (GitHub + Product Hunt)

# Collects CANDIDATES only. Nothing here goes on the website directly.
# Gemini Spark reads candidates.json, checks each item on its official page,
# and adds the good ones to the Google Sheet with status=verified.

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours, at :15
  workflow_dispatch: {}       # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-news            # same group as the Sheet sync, so they never push at the same time
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}    # optional - Product Hunt is skipped until you add it
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request, urllib.parse

          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          since = (now - datetime.timedelta(days=7)).strftime("%Y-%m-%d")

          def get(url, headers=None, data=None):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              return json.load(urllib.request.urlopen(req, timeout=30))

          # ---------- GitHub: new repos (last 7 days) with lots of stars ----------
          gh_headers = {"Accept": "application/vnd.github+json",
                        "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                        "User-Agent": "softmax-news-bot"}
          queries = [
              f"topic:llm created:>{since} stars:>100",
              f"topic:ai-agents created:>{since} stars:>100",
              f"topic:generative-ai created:>{since} stars:>100",
              f"topic:artificial-intelligence created:>{since} stars:>100",
              f"topic:machine-learning created:>{since} stars:>100",
              f"llm OR agent OR ai OR gpt OR model in:name,description created:>{since} stars:>200",
          ]
          repos = {}
          for q in queries:
              url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode(
                  {"q": q + " fork:false archived:false", "sort": "stars", "order": "desc", "per_page": 30})
              try:
                  for r in get(url, gh_headers).get("items", []):
                      if not r.get("description"):          # skip repos with no description
                          continue
                      repos[r["html_url"]] = {
                          "source": "GitHub",
                          "name": r["full_name"],
                          "url": r["html_url"],
                          "homepage": r.get("homepage") or "",
                          "description": r["description"][:300],
                          "stars": r["stargazers_count"],
                          "language": r.get("language") or "",
                          "license": (r.get("license") or {}).get("spdx_id") or "none",
                          "created": r["created_at"][:10],
                          "topics": r.get("topics", [])[:8],
                      }
              except Exception as e:
                  print("GitHub query failed:", q, e)
          github = sorted(repos.values(), key=lambda x: x["stars"], reverse=True)[:25]
          print(f"GitHub: {len(github)} candidates")

          # ---------- Product Hunt: today's top AI launches (needs PH_TOKEN) ----------
          ph = []
          token = os.environ.get("PH_TOKEN", "").strip()
          if token:
              after = (now - datetime.timedelta(days=2)).strftime("%Y-%m-%dT%H:%M:%SZ")
              gql = """query($after: DateTime!) {
                posts(first: 20, order: VOTES, topic: "artificial-intelligence", postedAfter: $after) {
                  edges { node { name tagline description url website votesCount createdAt
                                 topics(first: 5) { edges { node { name } } } } } } }"""
              try:
                  res = get("https://api.producthunt.com/v2/api/graphql",
                            {"Authorization": "Bearer " + token, "Content-Type": "application/json",
                             "Accept": "application/json", "User-Agent": "softmax-news-bot"},
                            json.dumps({"query": gql, "variables": {"after": after}}).encode())
                  for e in res.get("data", {}).get("posts", {}).get("edges", []):
                      n = e["node"]
                      ph.append({
                          "source": "Product Hunt",
                          "name": n["name"],
                          "url": n["url"],
                          "website": n.get("website") or "",
                          "description": (n.get("tagline") or "") + " - " + (n.get("description") or "")[:250],
                          "votes": n.get("votesCount", 0),
                          "created": (n.get("createdAt") or "")[:10],
                          "topics": [t["node"]["name"] for t in n.get("topics", {}).get("edges", [])],
                      })
                  if res.get("errors"):
                      print("Product Hunt errors:", res["errors"])
              except Exception as e:
                  print("Product Hunt failed:", e)
          else:
              print("PH_TOKEN not set - skipping Product Hunt")
          print(f"Product Hunt: {len(ph)} candidates")

          if not github and not ph:
              raise SystemExit("No candidates found - keeping the old candidates.json")

          with open("candidates.json", "w", encoding="utf-8") as f:
              json.dump({"updated": now.strftime("%Y-%m-%d %H:%M UTC"),
                         "note": "UNVERIFIED candidates. Check each on its official page before adding to the Sheet.",
                         "github": github, "producthunt": ph}, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain candidates.json)" ]; then
            git config user.name "softmax-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add candidates.json
            git commit -m "New tool candidates $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          else
            echo "No new candidates"
          fi
